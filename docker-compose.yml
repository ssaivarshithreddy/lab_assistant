version: '3.8'

services:
  # ==========================================
  # 1. POSTGRESQL DATABASE SERVICE
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: labsense-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lab_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-executes SQL schema migration on initial DB creation
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. MINIO OBJECT STORAGE SERVICE
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: labsense-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000" # MinIO S3 API Port
      - "9001:9001" # MinIO Web Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. EXPRESS NODE.JS BACKEND SERVICE
  # ==========================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: labsense-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lab_assistant
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      MINIO_BUCKET: labsense-reports
      JWT_SECRET: supersecret_jwt_key_labsense_2026
      VITE_GROQ_API_KEY: ${VITE_GROQ_API_KEY:-""}
      SMTP_HOST: ${SMTP_HOST:-""}
      SMTP_PORT: ${SMTP_PORT:-"587"}
      SMTP_USER: ${SMTP_USER:-""}
      SMTP_PASS: ${SMTP_PASS:-""}
      SMTP_FROM: ${SMTP_FROM:-""}
      SMTP_SERVICE: ${SMTP_SERVICE:-""}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ==========================================
  # 4. VITE REACT FRONTEND SERVICE
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labsense-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
