<!-- Debug script to test Supabase data fetching -->
<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard Debug</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Admin Dashboard Debug</h1>
    <div id="output" style="white-space: pre; background: #f0f0f0; padding: 10px; margin-top: 10px;"></div>
    
    <script>
        const VITE_SUPABASE_URL = "https://rqjkjwekuwrgprvbzqlk.supabase.co";
        const VITE_SUPABASE_SERVICE_ROLE_KEY = localStorage.getItem('service_role_key') || "PASTE_SERVICE_ROLE_KEY_HERE";
        
        const output = document.getElementById('output');
        
        function log(msg) {
            output.textContent += msg + '\n';
            console.log(msg);
        }
        
        async function testFetch() {
            log('🔍 Testing Supabase Admin Data Fetch\n');
            log(`URL: ${VITE_SUPABASE_URL}`);
            log(`Service Role Key: ${VITE_SUPABASE_SERVICE_ROLE_KEY?.substring(0, 20)}...`);
            
            if (!VITE_SUPABASE_SERVICE_ROLE_KEY || VITE_SUPABASE_SERVICE_ROLE_KEY === "PASTE_SERVICE_ROLE_KEY_HERE") {
                log('\n❌ ERROR: Service role key not set!');
                log('Set it with: localStorage.setItem("service_role_key", "your_key_here")');
                return;
            }
            
            const supabase = window.supabase.createClient(VITE_SUPABASE_URL, VITE_SUPABASE_SERVICE_ROLE_KEY);
            
            try {
                log('\n⏳ Fetching reports from Supabase...');
                const { data, error, status } = await supabase
                    .from('reports')
                    .select('id, user_id, created_at, file_name');
                
                if (error) {
                    log(`\n❌ ERROR (${status}): ${error.message}`);
                    log(`Details: ${JSON.stringify(error)}`);
                    return;
                }
                
                log(`\n✅ SUCCESS! Retrieved ${data?.length || 0} reports`);
                log(`\nReports data:\n${JSON.stringify(data?.slice(0, 3), null, 2)}`);
                
            } catch (err) {
                log(`\n❌ EXCEPTION: ${err.message}`);
            }
        }
        
        testFetch();
    </script>
</body>
</html>
